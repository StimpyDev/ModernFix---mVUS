plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id "maven-publish"
    id "com.github.johnrengelman.shadow" version "${shadow_version}"
}

group = 'org.embeddedt'
base {
    archivesName = 'modernfix'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
}

loom {
    accessWidenerPath = file("src/main/resources/modernfix.accesswidener")
    runs {
        client {
            vmArgs "-Xmx2G"
            property("mixin.debug.export", "true")
        }
        server {
            vmArgs "-Xmx2G"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    
    // MixinExtras
    implementation(include("io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"))
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"
    
    // Optional dependencies for compatibility
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    
    // Spark for profiling integration (optional)
    compileOnly "maven.modrinth:spark:1.10.156-fabric"
}

processResources {
    inputs.property "version", version
    inputs.property "supported_minecraft_versions", supported_minecraft_versions
    
    filesMatching("fabric.mod.json") {
        expand inputs.properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Add repositories to publish to here.
    }
}

println "ModernFix: " + version